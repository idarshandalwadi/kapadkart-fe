# Shop app → Cloudflare Pages project "kapadkart" (see wrangler.toml).
# Push to main publishes the production deployment.
# Pull requests run lint, tests, and the production build only.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Account token with Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID  Account ID from the Cloudflare dashboard

name: Deploy shop app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # The remaining npm test scripts also read the API repository, which
        # is a separate checkout and is not present here.
        run: |
          npm run test:exports
          npm run test:routing
          node scripts/test-pages-proxy.js

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          # Empty so the browser stays on the Pages origin. functions/ proxies /api.
          VITE_API_BASE_URL: ""

      - name: Publish to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: pages deploy dist --project-name=kapadkart --commit-hash=${{ github.sha }}
